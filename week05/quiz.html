<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML & CSS Quiz</title>
    <link rel="stylesheet" href="../styles/quiz.css">
</head>

<body>

    <h1>Basic HTML & CSS Quiz</h1>

    <form>

        <!-- Question 1: Text Input -->
        <label for="q1">1. What does the acronym CSS stand for?</label>
        <input type="text" id="q1" name="q1">

        <!-- Question 2: Textarea -->
        <label for="q2">2. How are id and class attributes selected in CSS?</label>
        <textarea id="q2" name="q2" rows="4"></textarea>

        <!-- Question 3: Select Dropdown -->
        <label for="q3">3. Which of the following is a valid CSS comment?</label>
        <select id="q3" name="q3">
            <option value="" selected disabled>Choose One ...</option>
            <option value="slash-star">/* This is a comment */</option>
            <option value="double-slash">// This is a comment</option>
            <option value="hash"># This is a comment</option>
        </select>

        <!-- Question 4: Number Input -->
        <label for="q4">4. What is the bottom margin given this declaration?
            margin: 10px 5px 15px;
        </label>
        <input type="number" id="q4" name="q4">

        <!-- Submit Button -->
        <button type="submit">Submit Quiz</button>

    </form>

</body>

</html>
